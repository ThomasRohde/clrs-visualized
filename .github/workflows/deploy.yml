# Publish to GitHub Pages, and only behind the gates.
#
# **The `ci` job below is the gate.** It runs ci.yml as a reusable workflow —
# the same file, the same jobs, against this exact commit — and `build` needs
# it, so nothing is uploaded until types, lint, formatting, README freshness,
# the generative suite, the browser pass over every player and the subpath
# link check have all passed. Deploy used to trigger independently on a push
# to the default branch and run only `npm run build`, which meant CI could go
# red and this workflow would publish that same commit regardless.
#
# Two things make it a real gate rather than a hopeful one. It is a job
# dependency, not a wait on timing, so there is no window in which a stale or
# unrelated CI run could satisfy it. And it applies to `workflow_dispatch`
# too: a manual deploy is still deliberate, but it cannot skip the checks —
# there is no input that turns them off, because a switch labelled "deploy
# anyway" gets used.
#
# ci.yml is where the jobs live; adding one there adds it to this gate with
# nothing to change here. In exchange, that workflow does not run on its own
# for master or main — it runs inside this one, so the gates run once per
# commit instead of twice. Every other branch and every pull request still
# runs CI directly.
#
# The destination is not hardcoded. `actions/configure-pages` reports where
# this repository will actually be served — origin and subpath — and those are
# handed to the build as SITE_URL and BASE_PATH, which is all
# `astro.config.mjs` reads. A project site lands under `/<repo>` and a user
# site at the root, and neither case needs a different config.
#
# Every internal link goes through `href()` in src/lib/paths.ts, and the
# `base-path` job asserts that, so the subpath case is checked rather than
# hoped for.
name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a superseded run is cancelled rather than left
# to finish.
#
# This was `cancel-in-progress: false` — GitHub's own Pages starter says a
# production deployment should be allowed to complete — and that was the right
# reading when this workflow did nothing but build. It is not any more. The
# gates now run *inside* this workflow, so letting a queued run finish means
# paying for a full CI pass, seven-minute browser sweep included, on a commit
# that the next run is about to overwrite. Two pushes six minutes apart cost
# sixteen minutes of runner time and published the same site twice.
#
# What that trades away is small and bounded. The newer commit is a superset of
# the older one, so nothing is lost by abandoning it, and the only cancellation
# that could bite lands inside `deploy-pages` — a nine-second step at the end of
# an eight-minute run. Pages keeps serving the previous deployment until a new
# one completes, so the failure mode is a site that stays stale until the next
# run finishes, not a half-published one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Every gate this project has, against the commit about to be published.
  # Inherits the caller's permissions, which are read-only for `contents`.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Work out where this will be served from
        id: pages
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
